# .github/workflows/snake.yml
name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2F7D1F&color_dots=#EBEDF0,#C6E6B3,#8FCB6B,#5BA53A,#2F7D1F
            dist/snake-dark.svg?palette=github-dark&color_snake=#6DB33F&color_dots=#161B22,#1F3A16,#2E5A1F,#4A8A2E,#6DB33F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
