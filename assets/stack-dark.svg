<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="st sd">
  <title id="st">Tech stack</title>
  <desc id="sd">Language and framework: Java, Spring Boot, Spring WebFlux, Spring Security, Hibernate. Data: Neo4j, PostgreSQL, MySQL, Redis. Messaging: Apache Kafka, Firebase. Tooling: Docker, Maven, Git, Postman, IntelliJ IDEA. Core: Java, Spring WebFlux, Neo4j, Apache Kafka.</desc>
  <style>
    .panel { fill: #0D1117; stroke: #30363D; }
    .rule { stroke: #30363D; }
    .layer { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .key { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .chip { fill: #161B22; stroke: #30363D; }
    .chip-core { fill: #1B2A17; stroke: #6DB33F; }
    .t { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .dot { fill: #6DB33F; }
    .row { animation: rise .5s cubic-bezier(.2,.8,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
  </style>
  <rect class="panel" x="1" y="1" width="898" height="298" rx="16"/>
  <text class="layer" x="32" y="38">Stack</text>
  <circle class="dot" cx="730" cy="33" r="5"/>
  <text class="key" x="742" y="38">daily core tools</text>
