    <rect class="chip-core" x="220" y="132" width="76" height="32" rx="8"/>
    <circle class="dot" cx="235" cy="148" r="4"/>
    <text class="t" x="246" y="153">Neo4j</text>
    <rect class="chip" x="305.56" y="132" width="103" height="32" rx="8"/>
    <text class="t" x="320" y="153">PostgreSQL</text>
    <rect class="chip" x="418.32" y="132" width="67" height="32" rx="8"/>
