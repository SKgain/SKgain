<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="gt gd">
  <title id="gt">Saikat Kumar Gain as a Neo4j graph</title>
  <desc id="gd">Saikat works at Dhrubok, which uses WebFlux, Neo4j and Kafka. He built Quickart, TaskMaster and a BanglaBERT API, and published four papers: Bangla semantics, liver disease, stroke prediction and ancient Bengal coinage.</desc>
